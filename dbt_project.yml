name: 'enterprise_analytics'
version: '1.0.0'
config-version: 2

profile: 'enterprise_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  date_spine_start: '2023-01-01'
  date_spine_end: '2025-12-31'

models:
  +persist_docs:
    columns: true
  enterprise_analytics:
    staging:
      +materialized: view
      +schema: stage
      +tags: ['staging']
    dimensions:
      +materialized: table
      +schema: dimensions
      +tags: ['dimensions']
    facts:
      +materialized: table
      +schema: stage
      +tags: ['facts']

seeds:
  enterprise_analytics:
    raw_customers:
      +column_types:
        customer_id: integer
        unit_annual_value: float
    raw_products:
      +column_types:
        product_id: integer
        unit_price: float
        cost_price: float
    raw_employees:
      +column_types:
        employee_id: integer
    raw_orders:
      +column_types:
        order_id: integer
        customer_id: integer
        employee_id: integer
        product_id: integer
        quantity: integer
        unit_price: float
        discount_pct: float
