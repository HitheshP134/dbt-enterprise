name: Claude dbt PR Review

on:
  pull_request:
    types: [opened, synchronize]

# Allow Claude to read the code and post review comments back on the PR.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # OAuth token from `claude setup-token` (Claude Pro/Max subscription).
          # Stored as a repo secret: Settings > Secrets and variables > Actions.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for this dbt project. The PR branch is already
            checked out in the current working directory.

            Review the changed models, tests, macros, seeds, and YAML against this
            project's standards (auto-loaded from `.claude/CLAUDE.md`). Focus on
            dbt-specific correctness and data-quality risks over generic style nitpicks.

            HOW TO COMMENT (important):
            - Post your findings as INLINE comments on the specific changed lines using
              `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`).
              This is your primary output - one inline comment per concrete issue.
            - After the inline comments, use `gh pr comment` ONCE for a short overall
              summary (e.g. counts by severity, overall verdict). Keep it brief.
            - Group style nits rather than spamming a comment per line.
            - If the PR looks clean, post a single short approving summary comment.
            - Only post GitHub comments - do not submit review text as chat messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
