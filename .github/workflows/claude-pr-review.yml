name: Claude dbt PR Review

on:
  pull_request:
    types: [opened, synchronize]

# A new push cancels an in-progress review for the same PR, so reviews don't
# stack up and double-post.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Allow Claude to read the code and post review comments back on the PR.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine last reviewed commit
        id: last_reviewed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          PR="${{ github.event.pull_request.number }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"

          LAST_SHA=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq -r '[.[] | select(.body | test("<!-- claude-review-sha: [0-9a-f]{7,40} -->")) | .body] | last // empty' \
            | grep -oE '[0-9a-f]{7,40}' || true)

          if [ -z "$LAST_SHA" ]; then
            LAST_SHA="$BASE_SHA"
          fi

          echo "sha=$LAST_SHA" >> "$GITHUB_OUTPUT"
          echo "Last reviewed SHA: $LAST_SHA"

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # OAuth token from `claude setup-token` (Claude Pro/Max subscription).
          # Stored as a repo secret: Settings > Secrets and variables > Actions.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            LAST REVIEWED SHA: ${{ steps.last_reviewed.outputs.sha }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            You are reviewing a pull request for this dbt project. The PR branch is already
            checked out in the current working directory.

            You are a REVIEWER ONLY. Do NOT edit, fix, or commit code. Do NOT push.
            Your only outputs are review comments. This is a single-pass review: post your
            comments and then STOP - do not loop, re-read, or re-review.

            SCOPE - only commits pushed since the last review:
            - Run `git diff ${{ steps.last_reviewed.outputs.sha }}..${{ github.event.pull_request.head.sha }}`
              and review ONLY the lines added/changed in that range. This is the incremental
              diff since your last review of this PR - on the first review of a PR, LAST
              REVIEWED SHA is the base branch commit, so this is effectively the full PR diff.
            - Do not comment on unchanged surrounding code, and do not re-review commits that
              were already covered by a prior review pass.

            GET CONTEXT BEFORE SUGGESTING ANY FIX (critical):
            - You can read the whole repo. Before proposing a change to a model, column, or
              macro, use Read/Grep/Glob to check how it is used elsewhere:
                * grep for the model name in other `ref('...')` calls to find downstream models,
                * grep for any column you'd rename/remove to see where it is selected downstream,
                * open the model's `.yml` and related upstream/downstream models.
            - Only suggest a fix you have confirmed will not break downstream models. If a
              change has downstream impact, DESCRIBE the impact and the safe fix instead of a
              naive one-line edit. If you cannot verify it is safe, point out the issue and
              recommend the author validate with `dbt build`, rather than prescribing a risky edit.

            AVOID DUPLICATES (belt-and-suspenders on top of the SCOPE restriction above):
            - First run `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`
              to fetch existing inline review comments.
            - Do NOT post a comment if an existing comment already covers the same file+line
              and issue. Only raise issues that are genuinely NEW since the last review.
            - If a previously-raised issue now appears fixed, say nothing about it.

            Review against this project's standards (auto-loaded from `.claude/CLAUDE.md`),
            focusing on dbt correctness and data-quality risks over style nitpicks.

            HOW TO COMMENT:
            - Post findings as INLINE comments on the changed lines using
              `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`).
            - Limit yourself to at most the ~8 most important NEW issues. Group style nits
              into a single comment rather than one per line.
            - After inline comments, use `gh pr comment` ONCE for a brief summary. The summary
              comment body MUST end with an HTML comment marker recording the commit you just
              reviewed, exactly in this form (on its own line, nothing else on it):
              `<!-- claude-review-sha: ${{ github.event.pull_request.head.sha }} -->`
              This marker is how the next run knows where to resume - do not omit it, and do
              not add it to inline comments, only to the single summary comment.
            - If there are no new issues, still post the short "no new issues" summary with
              the same marker line.
            - Only post GitHub comments - do not submit review text as chat messages.

          claude_args: |
            --max-turns 20
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git diff:*)"
